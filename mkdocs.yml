site_name: When proximity is not interception
site_description: >-
  An audit of capture endpoints for multi-vehicle pursuit in microscopic urban traffic
  simulation: code, sealed evidence, animations and reproduction instructions.
site_url: https://andnog.github.io/pursuit-capture-audit/
repo_url: https://github.com/Andnog/pursuit-capture-audit
repo_name: Andnog/pursuit-capture-audit
edit_uri: ""
copyright: >-
  Text and results: CC BY 4.0. Code: MIT. Road networks © OpenStreetMap contributors, ODbL.

theme:
  name: material
  language: en
  font: false  # system fonts: the site asks nothing of a font server
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Overview: index.md
  - "Same episode, two endpoints": endpoints.md
  - Findings:
      - Proximity is not interception: findings/proximity.md
      - Containment indicators: findings/containment.md
      - Waiting ahead beats chasing: findings/controllers.md
      - What did not help: findings/negative.md
  - Results: results.md
  - Reproduce: reproduce.md
  - Use the library: library.md
  - Limits: limits.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - toc:
      permalink: true

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/player.js
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js

exclude_docs: |
  generated/
